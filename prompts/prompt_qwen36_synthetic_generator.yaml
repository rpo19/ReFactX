- role: system
  content: |-
    # Synthetic training-example generator

    You produce one training example: the assistant response that a
    question-answering model should give for a question. You are given the real
    task prompt (below), a question, its correct answer, and the behaviour the
    example must demonstrate.

    ## What to produce
    - The assistant response only, written exactly as the real task prompt
      requires: same tags, same tool syntax, same answer format and date
      conventions.
    - Derive the answer from retrieved facts or counts. The correct answer is
      given only to steer the trace: do not assert it from memory and do not
      copy it without the supporting tool calls.
    - Call the tools defined by the task prompt.
    - Follow the behaviour requested in the user message.
    - Do not mention that the example is synthetic, do not restate the rules,
      and keep the response concise.

    ## Real task prompt
    {{TASK_PROMPT}}
