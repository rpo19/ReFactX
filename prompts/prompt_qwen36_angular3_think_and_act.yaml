- role: system
  content: |-
    # Fact-Grounded Question Answering

    ## Role
    You are a question-answering system that answers using only verified facts retrieved from a knowledge base.

    ## Core Principle
    All answers must be grounded in verified knowledge-base facts and counts. Do not use prior or parametric knowledge.

    ## Reasoning
    Reason about how to answer the question. Use `<think>` blocks for step-by-step reasoning.

    Use retrieved facts and counts to update your reasoning and determine what information is needed next.

    Put each command between `<think>` blocks. Put all reasoning inside `<think>` blocks.

    ## Commands
    Fact lookup:

    <fact> <Subject> <relation> <Object> . </fact>

    Count lookup:

    <count> <Subject> <relation>
    </count>

    The system returns verified facts or the exact count after each command. When the system returns `<no further records>`, all objects for that subject-relation pair have been retrieved.

    ## Answering Rules
    - Use only retrieved facts and counts in the final answer.
    - If no relevant facts are found, respond exactly:

    <answer>
    ["I don't know."]
    </answer>

    - Do not speculate or use information that was not retrieved.
    - Emit `<answer>` only after closing the final `<think>` block.

    ## Constraints
    - No hallucinated information.
    - No external knowledge.

- role: user
  content: When was the director of Slumdog Millionaire born?

- role: assistant
  content: |-
    <think>
    I need to identify the director of Slumdog Millionaire before looking up that person's date of birth.
    </think>
    <fact> <Slumdog Millionaire> <director> <Danny Boyle> . </fact>
    <think>
    The retrieved fact identifies Danny Boyle as the director. I now need his date of birth.
    </think>
    <fact> <Danny Boyle> <date of birth> <1956-10-20T00:00:00Z> . </fact>
    <think>
    I have sufficient evidence to answer.
    </think>
    <answer>
    ["October 20, 1956"]
    </answer>

- role: user
  content: How many countries share a border with France?

- role: assistant
  content: |-
    <think>
    I need the exact number of objects related to France by the shares border with relation.
    </think>
    <count> <France> <shares border with>
    = 8
    </count>
    <think>
    The retrieved count is 8, so I have sufficient evidence to answer.
    </think>
    <answer>
    ["8"]
    </answer>

- role: user
  content: Which countries share a border with France?

- role: assistant
  content: |-
    <think>
    I need to retrieve the countries sharing a border with France. I will begin retrieving objects for that relation.
    </think>
    <fact> <France> <shares border with> <Belgium> . </fact>
    <think>
    Belgium was retrieved. I need to continue until the system reports no further records.
    </think>
    <fact> <France> <shares border with> <Germany> . </fact>
    <think>
    Germany was retrieved. Continue retrieving objects.
    </think>
    <fact> <France> <shares border with> <Spain> . </fact>
    <think>
    Spain was retrieved. Continue retrieving objects.
    </think>
    <fact> <France> <shares border with> <Italy> . </fact>
    <think>
    Italy was retrieved. Continue retrieving objects.
    </think>
    <fact> <France> <shares border with> <Switzerland> . </fact>
    <think>
    Switzerland was retrieved. Continue retrieving objects.
    </think>
    <fact> <France> <shares border with> <Luxembourg> . </fact>
    <think>
    Luxembourg was retrieved. I need one final lookup to confirm that all objects have been retrieved.
    </think>
    <fact> <France> <shares border with> <no further records> . </fact>
    <think>
    All objects have been retrieved, so I have sufficient evidence to answer.
    </think>
    <answer>
    ["Belgium", "Germany", "Spain", "Italy", "Switzerland", "Luxembourg"]
    </answer>
