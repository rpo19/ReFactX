[build-system]
requires = ["setuptools>=61.0", "wheel", "build"]
build-backend = "setuptools.build_meta"

[project]
name = "refactx"
version = "0.1.2"
description = "Refactx package"
readme = "Readme-pip.md"
license = "Apache-2.0"
authors = [ { name = "Riccardo Pozzi" } ]
requires-python = ">=3.8"

dependencies = [
	"tqdm",
	"python-dotenv",
	"PyYAML",
	"click",
	"psycopg[binary]>=3.0",
	"cachetools",
	"requests",
]

[project.optional-dependencies]
torch = [
	"torch",
	"torchvision==0.29.0",
	"transformers>=5.3",
	"accelerate",
	"pillow==12.3.0",
	"flash-linear-attention==0.5.2",
]
httpindex = [
	"flask",
	"gunicorn",
]
vadalog = [
	"vadalog-portable @ git+https://github.com/joint-kg-labs/vadalog-portable@b0e96f5b6c60ba4a507916c60795f515e16b26cf",
	"pandas",
	"ipywidgets",
]

[project.scripts]
refactx-populate-postgres = "refactx.cli.populate_postgres:main"
refactx-debug-postgres = "refactx.cli.debug_postgres:main"

[tool.setuptools.packages.find]
include = ["refactx*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.urls]
Homepage = "https://github.com/rpo19/ReFactX"
Repository = "https://github.com/rpo19/ReFactX"
"Bug Tracker" = "https://github.com/rpo19/ReFactX/issues"
